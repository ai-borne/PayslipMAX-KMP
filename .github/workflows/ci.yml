name: Gold Standard CI

on:
  push:
    branches: [ main, master, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, master, 'feature/**', 'release/**' ]

# Hardened default permissions. 'checks: write' is required to publish test reports.
permissions:
  contents: read
  checks: write

# Cancel in-progress runs for the same workflow/branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: 🔒 Security Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        # Uses the free OSS CLI directly rather than gitleaks/gitleaks-action, which now requires a
        # paid GITLEAKS_LICENSE secret for organization repos. Mirrors the local pre-commit/pre-push
        # hooks (scripts/git-pre-commit.sh, scripts/git-pre-push.sh), which already use the CLI.
        run: |
          # Pinned (matches the local hooks) rather than resolved via the unauthenticated GitHub API,
          # which returns 403 when the shared runner IP is rate-limited and made this job flaky.
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Secret Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  web-changes:
    name: 🔎 Detect Web Prototype Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff Against Base
        id: diff
        # Job-level (not workflow-level) filtering so the KMP and Gitleaks jobs still run on every
        # change. Fails open: if the base commit is unknown (new branch, force push), run the job.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD -- web-prototype .github/workflows/ci.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  web-prototype-ci:
    name: 🌐 Web Prototype CI
    needs: web-changes
    if: needs.web-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-prototype
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web-prototype/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Audit
        # Production deps only: dev-only tooling advisories (e.g. stylelint) never ship and kept
        # turning this job red whenever a new advisory was published.
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run Stylelint
        run: npm run lint:css

      - name: Run Vitest Tests
        run: npm run test

      - name: Verify Production Build
        run: npm run build

  kmp-android-common-ci:
    name: 🤖 KMP Android & Common CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Test the Tech Debt Audit Script
        run: python3 -m unittest discover -s scripts/tests

      - name: Audit Tech Debt Limits and Regressions
        run: python3 scripts/check_tech_debt_limits.py --strict

      - name: Check Room Schema Immutability
        run: python3 scripts/check_schema_immutability.py

      - name: Run Lint, Code Style & Tests (Android + Common)
        run: ./gradlew check -x iosX64Test -x iosSimulatorArm64Test

      - name: Test the Claim Guide Data Tools (compile rules, nav, stale-bundle guard)
        run: python3 -m unittest discover -s docs/Plan/rule_cards/tools -p 'test_*.py'

      - name: Verify R8 Release Minification & Rules
        # assembleRelease (not just minifyReleaseWithR8): the Guide bundle is an asset, which only lands in the APK.
        run: ./gradlew :composeApp:assembleRelease -PallowPlaceholderGemmaModel=true

      - name: Verify the Claim Guide Survives R8 (models, serializers, bundle bytes)
        # minifiedTest = release R8 config with the Guide reachable (what release becomes at phase E9).
        run: ./gradlew :composeApp:assembleMinifiedTest -PallowPlaceholderGemmaModel=true && python3 scripts/check_r8_guide.py

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmp-android-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  kmp-ios-ci:
    name: 🍎 KMP iOS CI
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Verify iOS Framework Links (Fail-Fast, mirrors Xcode build phase)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 -q

      - name: Run iOS Unit Tests
        run: ./gradlew iosSimulatorArm64Test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload iOS Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmp-ios-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

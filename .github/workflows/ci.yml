name: Gold Standard CI

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master, 'feature/**' ]

# Hardened default permissions. 'checks: write' is required to publish test reports.
permissions:
  contents: read
  checks: write

# Cancel in-progress runs for the same workflow/branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: 🔒 Security Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        # Uses the free OSS CLI directly rather than gitleaks/gitleaks-action, which now requires a
        # paid GITLEAKS_LICENSE secret for organization repos. Mirrors the local pre-commit/pre-push
        # hooks (scripts/git-pre-commit.sh, scripts/git-pre-push.sh), which already use the CLI.
        run: |
          GITLEAKS_VERSION=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -Po '"tag_name": "v\K[^"]*')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Secret Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  web-prototype-ci:
    name: 🌐 Web Prototype CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-prototype
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web-prototype/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Audit
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run Stylelint
        run: npm run lint:css

      - name: Run Vitest Tests
        run: npm run test

      - name: Verify Production Build
        run: npm run build

  kmp-android-common-ci:
    name: 🤖 KMP Android & Common CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Audit Tech Debt Limits and Regressions
        run: python3 scripts/check_tech_debt_limits.py

      - name: Check Room Schema Immutability
        run: python3 scripts/check_schema_immutability.py

      - name: Run Lint, Code Style & Tests (Android + Common)
        run: ./gradlew check -x iosX64Test -x iosSimulatorArm64Test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmp-android-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  kmp-ios-ci:
    name: 🍎 KMP iOS CI
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Verify iOS Framework Links (Fail-Fast, mirrors Xcode build phase)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 -q

      - name: Run iOS Unit Tests
        run: ./gradlew iosSimulatorArm64Test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload iOS Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmp-ios-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

name: Gold Standard CI

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master, 'feature/**' ]

# Hardened default permissions. 'checks: write' is required to publish test reports.
permissions:
  contents: read
  checks: write

# Cancel in-progress runs for the same workflow/branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: 🔒 Security Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  functions-ci:
    name: ☁️ Firebase Functions CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies
        # Gracefully skips if functions/ is not yet scaffolded (Phase 0)
        run: '[ -f package.json ] && npm ci || echo "functions/ not yet scaffolded — skipping"'

      - name: Run Dependency Audit
        run: '[ -f package.json ] && npm audit --audit-level=high || true'

      - name: Run Jest Unit Tests
        run: '[ -f package.json ] && npm test || echo "No tests yet — Phase 1 pending"'

  web-prototype-ci:
    name: 🌐 Web Prototype CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-prototype
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-prototype/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Audit
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run Stylelint
        run: npm run lint:css

      - name: Run Vitest Tests
        run: npm run test

      - name: Verify Production Build
        run: npm run build

  kmp-android-common-ci:
    name: 🤖 KMP Android & Common CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Audit Tech Debt Limits and Regressions
        run: python3 scripts/check_tech_debt_limits.py

      - name: Run Lint, Code Style & Tests (Android + Common)
        run: ./gradlew check -x iosX64Test -x iosSimulatorArm64Test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmp-android-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  kmp-ios-ci:
    name: 🍎 KMP iOS CI
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run iOS Unit Tests
        run: ./gradlew iosX64Test iosSimulatorArm64Test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload iOS Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmp-ios-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
